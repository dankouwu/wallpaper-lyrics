name: Bug
description: Something the wallpaper does that it should not
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the wallpaper is affected
      options:
        - Background or colour
        - Lyrics or timing
        - Player detection or notification controls
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see on the screen. If it is a visual glitch, a photo of the phone beats a description.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to trigger the problem. State whether it happens every time or intermittently.
      value: |
        1.
        2.
        3.

        Frequency (every time or intermittently):
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, then About. Or the version of the release you installed.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      description: Android 8 or newer. Below 13 there is no RuntimeShader, so the background falls back to gradient meshes and looks different on purpose.
      placeholder: "14"
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: "Samsung Galaxy S25 Ultra"
    validations:
      required: true

  - type: dropdown
    id: player
    attributes:
      label: What was playing it
      options:
        - Spotify
        - Tidal
        - KDE Connect
        - Something else
        - Nothing was playing
    validations:
      required: true

  - type: input
    id: track
    attributes:
      label: Artist and track
      description: Only if this is a background colour, artwork, or song-specific problem.
      placeholder: "Justin Bieber, Hold Tight"

  - type: checkboxes
    id: setup
    attributes:
      label: Setup
      description: Most reports that turn out not to be bugs are one of these three. Check what is actually on.
      options:
        - label: Notification access is granted (checked in Wallpaper Lyrics, shows "Granted")
        - label: Battery usage is set to Unrestricted (checked in Wallpaper Lyrics, shows "Unrestricted")
        - label: If using Spotify, Device Broadcast Status is enabled inside Spotify settings

  - type: textarea
    id: logs
    attributes:
      label: Logcat
      description: Optional, and the fastest way to get this fixed. Plug the phone in and run the command below while the problem is on screen.
      value: |
        <details>
        <summary>adb logcat -s Wallpaper:V LyricsManager:V MediaObserver:V WP-Drift:V WallpaperDemo:V</summary>

        ```
        paste here
        ```

        </details>
