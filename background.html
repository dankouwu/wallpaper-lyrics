<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Dynamic Background</title>
    <style>
        /* Base styles from spicy-lyrics project */
        :root {
            --bg-color: #121212;
            --accent-color: #1db954;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .spicy-dynamic-bg {
            height: 100%;
            left: 0;
            overflow: hidden;
            pointer-events: none;
            position: absolute;
            top: 0;
            width: 100%;
            transform-origin: center center;
            /* From spicy-dynamic-bg.css */
            filter: saturate(2.5) brightness(0.65);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(18, 18, 18, 0.4) 100%);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas" class="spicy-dynamic-bg"></canvas>

    <div class="content">
        <h1>Spicy Background</h1>
        <p>Extracted from Spicy Lyrics</p>
        
        <div class="controls">
            <button onclick="setTheme('spotify')" id="btn-spotify" class="active">Spotify Green</button>
            <button onclick="setTheme('sunset')" id="btn-sunset">Sunset</button>
            <button onclick="setTheme('ocean')" id="btn-ocean">Deep Ocean</button>
            <button onclick="setTheme('lavender')" id="btn-lavender">Lavender</button>
            <button onclick="setTheme('fire')" id="btn-fire">Hellfire</button>
            <button onclick="document.getElementById('img-upload').click()">Upload Image</button>
            <input type="file" id="img-upload" style="display: none" accept="image/*" onchange="handleUpload(event)">
            <div style="margin-top: 15px; display: flex; gap: 5px;">
                <input type="text" id="img-url" placeholder="Paste image URL here..." style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 20px; outline: none; flex-grow: 1;">
                <button onclick="handleUrlLoad()">Load URL</button>
            </div>
            <div style="margin-top: 20px; display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 20px; backdrop-filter: blur(5px);">
                <span style="font-size: 0.9rem; opacity: 0.8;">Vibe Speed</span>
                <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="0.6" style="flex-grow: 1; cursor: pointer;" oninput="updateSpeed(this.value)">
            </div>
        </div>
    </div>

    <script type="module">
        import { Kawarp } from 'https://cdn.jsdelivr.net/npm/@kawarp/core@1.1.1/dist/index.js';

        const canvas = document.getElementById('bg-canvas');
        
        // Boosted options for a more "alive" feel
        const options = {
            warpIntensity: 1.4, // Higher warping
            blurPasses: 8,
            animationSpeed: 0.6, // Faster base speed
            saturation: 1.8,
            dithering: 0.01,
            transitionDuration: 1200,
            tintIntensity: 0,
            scale: 1.1, // Slight scale for parallax room
        };

        const kawarp = new Kawarp(canvas, options);

        // Mouse Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            canvas.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.1)`;
        });

        window.updateSpeed = (val) => {
            kawarp.setOptions({ animationSpeed: parseFloat(val) });
        };

        const themes = {
            spotify: ['#1db954', '#191414', '#1ed760'],
            sunset: ['#ff5f6d', '#ffc371', '#ff2d55'],
            ocean: ['#2193b0', '#6dd5ed', '#00467f'],
            lavender: ['#8e44ad', '#3498db', '#9b59b6'],
            fire: ['#e74c3c', '#f1c40f', '#c0392b']
        };

        window.setTheme = async (name) => {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            if (document.getElementById(`btn-${name}`)) {
                document.getElementById(`btn-${name}`).classList.add('active');
            }

            // Using loadGradient to set "basic colors"
            if (kawarp.loadGradient) {
                await kawarp.loadGradient(themes[name], 135);
            } else {
                // Fallback: create a small canvas with a gradient and use loadImage
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 256;
                tempCanvas.height = 256;
                const ctx = tempCanvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 256, 256);
                themes[name].forEach((color, i) => {
                    grad.addColorStop(i / (themes[name].length - 1), color);
                });
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);
                await kawarp.loadImage(tempCanvas.toDataURL());
            }
        };

        window.handleUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                await kawarp.loadImage(e.target.result);
            };
            reader.readAsDataURL(file);
        };

        window.handleUrlLoad = async () => {
            const url = document.getElementById('img-url').value;
            if (!url) return;
            
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            try {
                // Note: The URL must allow CORS or be from the same origin for WebGL to use it
                await kawarp.loadImage(url);
            } catch (err) {
                console.error("Failed to load image from URL. Ensure the URL supports CORS.", err);
                alert("Failed to load image. This is often due to CORS restrictions on the image source.");
            }
        };

        // Initialize
        async function init() {
            kawarp.start();
            await setTheme('spotify');
            
            window.addEventListener('resize', () => {
                if (kawarp.resize) kawarp.resize();
            });
        }

        init();
    </script>
</body>
</html>
